<!-- base.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    
    <title>{% block title %}Tim's Site{% endblock %}</title>
    <style>
        /* Apply the Roboto font to the entire body */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
        }

        /* Sidebar styling */
        .sidenav {
            height: 100%;
            width: 200px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
        }

        .sidenav a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: #f8f9fa;
            display: block;
        }

        .sidenav a:hover {
            background-color: #495057;
            color: #ffffff;
        }

        /* Main content styling */
        .main {
            margin-left: 220px;
            padding: 20px;
        }

        /* Top-right corner styling */
        .top-right {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 1000;
        }

        .top-right form,
        .top-right a {
            display: inline-block;
            margin-left: 10px;
        }

        .top-right span {
            font-weight: 500;
            color: #343a40;
        }

        /* Header styling */
        .header {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        /* Button styling */
        .btn {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidenav">
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="{% url 'profile' %}">Profile</a> <!-- Updated to use the 'profile' URL -->
    </div>

    <!-- Top-right corner for login/logout/profile -->
    <div class="top-right">
        {% if user.is_authenticated %}
            <span>Welcome, {{ user.username }}!</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">Log out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Log in</a>
        {% endif %}
    </div>

    <!-- Header -->
    <div class="header">
        <h1>Health Monitor</h1>
    </div>

    <!-- Main content -->
    <div id="content" name="content" class="main">
        <div class="container">
            {% block content %}
            <p>Welcome to the Health Monitor application!</p>
            {% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4xF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
